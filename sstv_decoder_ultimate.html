================================================================================
  Nom        : sstv_decoder_ultimate.html
  Objet      : décodeur SSTV depuis un fichier WAV ou l'audio en direct (micro) :
               détection VIS, PLL, AFC, correction Doppler et d'inclinaison,
               modes Robot, Martin, Scottie, PD ; export PNG
  Auteur     : Eric PERRET

  Historique :
    1.0 (2026-01-17) version initiale

    1.2 (2026-10-17) mode micro : fréquence d'échantillonnage du micro reprise

                     téléphone, écran maintenu allumé pendant la capture
    1.3 (2026-10-17) micro laissé dans ses réglages par défaut (traitements
                     du navigateur coupés seulement sur demande) ; jauge de
                     niveau en dBFS avec plage conseillée et saturation ;
                     enregistrement de la capture micro en WAV
    1.4 (2026-10-17) aucun journal affiché ; onglet micro épuré : Robot36
                     seul, démarrage sur 4 synchros franches et régulières
                     (VIS Robot36 facultatif, prioritaire en cours d'image),
                     bouton bascule des traitements audio actif pendant la

                     enregistrement de la capture sous l'image
================================================================================

    <script>
    // ==========================================================================

    const SSTV_MODES = {
        robot36: {

            visCode: 0x08,
            width: 320, height: 240,
            scanMs: 88, chromaMs: 44,

        },

            visCode: 0x2C,

        },

            visCode: 0x38,
            width: 320, height: 256,
            scanMs: 88.064,
            syncMs: 9.0, porchMs: 1.5, separatorMs: 1.5,

        },
        pd90: {
            name: "PD90",
            visCode: 0x63,
            width: 320, height: 256,
            scanMs: 170.240,
            syncMs: 20.0, porchMs: 2.08,
            lineSequence: "pd"
        },
        pd120: {
            name: "PD120",
            visCode: 0x5F,
            width: 640, height: 496,
            scanMs: 121.6,
            syncMs: 20.0, porchMs: 2.08,

        },
        pd160: {

            visCode: 0x62,
            width: 512, height: 400,
            scanMs: 195.584,
            syncMs: 20.0, porchMs: 2.08,

        },

        },

            visCode: 0x61,
            width: 640, height: 496,
            scanMs: 244.48,
            syncMs: 20.0, porchMs: 2.08,
            lineSequence: "pd"
        }
    };
    
    // VIS code mapping

    for (const [key, mode] of Object.entries(SSTV_MODES)) {
        VIS_TO_MODE[mode.visCode] = key;
    }
    
    // SSTV frequency constants
    const FREQ = {
        SYNC: 1200,
        BLACK: 1500,
        WHITE: 2300,
        RANGE: 800,  // WHITE - BLACK
        VIS_LEADER: 1900,
        VIS_BREAK: 1200,
        VIS_ONE: 1100,
        VIS_ZERO: 1300
    };
    
    // ==========================================================================
    // GLOBALS
    // ==========================================================================
    
    let audioData = null;
    let sampleRate = 44100;
    let demodulatedFreq = null;  // Pre-computed frequency array
    let dopplerOffset = 0;
    let debugLog = [];
    
    // ==========================================================================
    // UI HANDLERS
    // ==========================================================================
    
    document.getElementById('fileInput').addEventListener('change', handleFileSelect);
    document.getElementById('analyzeBtn').addEventListener('click', analyzeSignal);
    document.getElementById('decodeBtn').addEventListener('click', handleDecode);
    document.getElementById('saveBtn').addEventListener('click', saveImage);
    
    function log(msg) {
        const timestamp = new Date().toISOString().substr(11, 12);
        debugLog.push(`[${timestamp}] ${msg}`);   // mémoire interne, jamais affichée
    }
    
    function updateProgress(percent) {

    // ==========================================================================
    // WAV LOADING
    // ==========================================================================
    
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        debugLog = [];
        log(`Loading: ${file.name} (${Math.round(file.size/1024)} KB)`);
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                parseWAV(e.target.result);
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('decodeBtn').disabled = false;
                
                const duration = (audioData.length / sampleRate).toFixed(2);
                const info = document.getElementById('fileInfo');
                info.style.display = 'block';
                info.innerHTML = `Sample rate: ${sampleRate} Hz | Duration: ${duration}s | Samples: ${audioData.length.toLocaleString()}`;
                
                log(`WAV loaded: ${sampleRate}Hz, ${duration}s, ${audioData.length} samples`);
                
                drawWaveform();
                
            } catch (err) {
                showError('WAV read error: ' + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    }
    
    function parseWAV(arrayBuffer) {
        const view = new DataView(arrayBuffer);
        const tag = o => String.fromCharCode(view.getUint8(o), view.getUint8(o+1), view.getUint8(o+2), view.getUint8(o+3));
        
        if (arrayBuffer.byteLength < 12 || tag(0) !== 'RIFF') throw new Error('Invalid WAV: no RIFF header');
        if (tag(8) !== 'WAVE') throw new Error('Invalid WAV: no WAVE marker');
        
        let offset = 12;
        let fmt = null;
        
        while (offset + 8 <= arrayBuffer.byteLength) {
            const chunkId = tag(offset);
            const chunkSize = view.getUint32(offset + 4, true);
            const body = offset + 8;
            
            if (chunkId === 'fmt ') {
                let format = view.getUint16(body, true);
                if (format === 0xFFFE && chunkSize >= 40) format = view.getUint16(body + 24, true); // WAVE_FORMAT_EXTENSIBLE
                fmt = {
                    format,
                    channels: view.getUint16(body + 2, true),
                    rate: view.getUint32(body + 4, true),
                    blockAlign: view.getUint16(body + 12, true),
                    bits: view.getUint16(body + 14, true)
                };
                sampleRate = fmt.rate;
                log(`Format: ${fmt.format === 3 ? 'float' : 'PCM'} ${fmt.bits}-bit, ${fmt.channels} voie(s), ${sampleRate} Hz`);
            }
            
            if (chunkId === 'data') {
                if (!fmt) throw new Error('Invalid WAV: data before fmt');
                const bytes = Math.min(chunkSize, arrayBuffer.byteLength - body);
                const frames = Math.floor(bytes / fmt.blockAlign);
                audioData = new Float32Array(frames);
                demodulatedFreq = null;
                fileTrack = null;
                
                // Voie 1 uniquement
                for (let i = 0; i < frames; i++) {
                    const p = body + i * fmt.blockAlign;
                    let v;
                    if (fmt.format === 3 && fmt.bits === 32) v = view.getFloat32(p, true);
                    else if (fmt.bits === 16) v = view.getInt16(p, true) / 32768;
                    else if (fmt.bits === 8) v = (view.getUint8(p) - 128) / 128;
                    else if (fmt.bits === 24) v = (view.getUint8(p) | (view.getUint8(p+1) << 8) | (view.getInt8(p+2) << 16)) / 8388608;
                    else if (fmt.bits === 32) v = view.getInt32(p, true) / 2147483648;
                    else throw new Error(`Unsupported WAV: ${fmt.bits}-bit`);
                    audioData[i] = v;
                }
                
                log(`Data loaded: ${frames.toLocaleString()} samples`);
                return;
            }
            
            offset = body + chunkSize + (chunkSize & 1);
        }
        
        throw new Error('No data chunk found in WAV');
    }
    
    // ==========================================================================
    // FM DEMODULATION - PLL (Phase-Locked Loop)
    // ==========================================================================
    
    class PLL {
        constructor(sampleRate, centerFreq = 1900, bandwidth = 500) {
            this.sampleRate = sampleRate;
            this.centerFreq = centerFreq;
            this.phase = 0;
            this.freq = centerFreq;
            
            // PLL loop filter coefficients
            // Bandwidth determines tracking speed vs noise immunity
            const damping = 0.707;  // Critically damped
            const omega = 2 * Math.PI * bandwidth / sampleRate;
            
            this.alpha = 2 * damping * omega;  // Phase detector gain
            this.beta = omega * omega;          // Frequency detector gain
            
            // Limits
            this.minFreq = 1000;
            this.maxFreq = 2500;
        }
        
        process(sample) {
            // Generate local oscillator
            const lo_i = Math.cos(this.phase);
            const lo_q = Math.sin(this.phase);
            
            // Phase detector (multiply and get phase error)
            // For real input, we use a simplified approach
            const phaseError = sample * lo_q;
            
            // Loop filter (PI controller)
            this.freq += this.beta * phaseError;
            this.freq = Math.max(this.minFreq, Math.min(this.maxFreq, this.freq));
            
            const phaseAdj = this.alpha * phaseError;
            
            // Update phase
            this.phase += 2 * Math.PI * this.freq / this.sampleRate + phaseAdj;
            
            // Wrap phase
            while (this.phase > 2 * Math.PI) this.phase -= 2 * Math.PI;
            while (this.phase < 0) this.phase += 2 * Math.PI;
            
            return this.freq;
        }
        
        reset(freq = 1900) {
            this.freq = freq;
            this.phase = 0;
        }
    }
    
    // ==========================================================================
    // FM DEMODULATION - Zero Crossing with Interpolation
    // ==========================================================================
    
    function demodulateZeroCrossing(samples, sampleRate, outputLength = null) {
        const n = samples.length;
        const freqs = new Float32Array(outputLength || n);
        
        let crossings = [];
        let lastSign = samples[0] >= 0 ? 1 : -1;
        
        // Find all zero crossings with sub-sample interpolation
        for (let i = 1; i < n; i++) {
            const sign = samples[i] >= 0 ? 1 : -1;
            if (sign !== lastSign) {
                // Linear interpolation for exact crossing point
                const frac = Math.abs(samples[i-1]) / (Math.abs(samples[i-1]) + Math.abs(samples[i]));
                crossings.push(i - 1 + frac);
                lastSign = sign;
            }
        }
        
        // Convert crossings to instantaneous frequency
        if (crossings.length < 2) {
            freqs.fill(1500);
            return freqs;
        }
        
        let freqIdx = 0;
        for (let i = 1; i < crossings.length; i++) {
            const halfPeriod = crossings[i] - crossings[i-1];
            const freq = sampleRate / (halfPeriod * 2);
            
            // Only accept valid SSTV frequencies
            if (freq >= 1000 && freq <= 2500) {
                const startSample = Math.floor(crossings[i-1]);
                const endSample = Math.min(Math.floor(crossings[i]), freqs.length - 1);
                
                for (let j = startSample; j <= endSample; j++) {
                    if (j < freqs.length) freqs[j] = freq;
                }
            }
        }
        
        // Fill gaps (areas with no valid crossings)
        let lastValid = 1500;
        for (let i = 0; i < freqs.length; i++) {
            if (freqs[i] === 0) {
                freqs[i] = lastValid;
            } else {
                lastValid = freqs[i];
            }
        }
        
        return freqs;
    }
    
    // ==========================================================================
    // FM DEMODULATION - Quadrature (Hilbert Transform)
    // ==========================================================================
    
    function demodulateQuadrature(samples, sampleRate) {
        const n = samples.length;
        const freqs = new Float32Array(n);
        
        // Hilbert transform via FIR filter (truncated ideal)
        // Using a simple 31-tap approximation
        const hilbertLen = 31;
        const hilbert = new Float32Array(hilbertLen);
        const mid = Math.floor(hilbertLen / 2);
        
        for (let i = 0; i < hilbertLen; i++) {
            const k = i - mid;
            if (k === 0) {
                hilbert[i] = 0;
            } else if (k % 2 !== 0) {
                hilbert[i] = 2 / (Math.PI * k);
            } else {
                hilbert[i] = 0;
            }
        }
        
        // Apply Hilbert transform to get quadrature component
        const Q = new Float32Array(n);
        for (let i = mid; i < n - mid; i++) {
            let sum = 0;
            for (let j = 0; j < hilbertLen; j++) {
                sum += samples[i - mid + j] * hilbert[j];
            }
            Q[i] = sum;
        }
        
        // Instantaneous frequency from phase derivative
        // f = (1/2π) * d(atan2(Q,I))/dt
        for (let i = 1; i < n - 1; i++) {
            const I = samples[i];
            const Iq = Q[i];
            const I_prev = samples[i-1];
            const Q_prev = Q[i-1];
            
            // Phase difference using cross-product formula
            // avoids atan2 discontinuities
            const num = I * Q_prev - Iq * I_prev;
            const den = I * I_prev + Iq * Q_prev;
            
            let dPhase = Math.atan2(num, den);
            let freq = dPhase * sampleRate / (2 * Math.PI);
            
            // Shift to positive frequency (baseband to SSTV range)
            freq = Math.abs(freq);
            
            // This gives us deviation from carrier - need to add center freq
            // Actually for SSTV audio, we measure directly
            // Re-estimate using zero-crossing for now on problem areas
            if (freq < 500) {
                // Low freq = near zero crossing, estimate from amplitude
                freq = 1500; // Default to black level
            } else if (freq > 2500) {
                freq = 2300;
            } else if (freq < 1000) {
                freq = 1200;
            }
            
            freqs[i] = freq;
        }
        
        freqs[0] = freqs[1];
        freqs[n-1] = freqs[n-2];
        
        return freqs;
    }
    
    // ==========================================================================
    // HYBRID DEMODULATOR - Best of both methods
    // ==========================================================================
    
    function demodulateHybrid(samples, sampleRate) {
        const n = samples.length;
        
        // Use zero-crossing as primary (most reliable for clean signals)
        const freqZC = demodulateZeroCrossing(samples, sampleRate);
        
        // Apply median filter to remove spikes (3-tap)
        const freqs = new Float32Array(n);
        for (let i = 1; i < n - 1; i++) {
            const a = freqZC[i-1], b = freqZC[i], c = freqZC[i+1];
            // Median of 3
            if ((a <= b && b <= c) || (c <= b && b <= a)) {
                freqs[i] = b;
            } else if ((b <= a && a <= c) || (c <= a && a <= b)) {
                freqs[i] = a;
            } else {
                freqs[i] = c;
            }
        }
        freqs[0] = freqs[1];
        freqs[n-1] = freqs[n-2];
        
        // Light smoothing (exponential moving average)
        const alpha = 0.3;
        let smoothed = freqs[0];
        for (let i = 0; i < n; i++) {
            smoothed = alpha * freqs[i] + (1 - alpha) * smoothed;
            freqs[i] = smoothed;
        }
        
        return freqs;
    }
    
    // ==========================================================================
    // FULL AUDIO DEMODULATION (run once, cache result)
    // ==========================================================================
    
    function demodulateFullAudio() {
        log('Demodulating full audio stream...');
        const startTime = performance.now();
        
        // Process in chunks for progress updates
        const chunkSize = sampleRate; // 1 second chunks
        const numChunks = Math.ceil(audioData.length / chunkSize);
        
        demodulatedFreq = new Float32Array(audioData.length);
        
        for (let chunk = 0; chunk < numChunks; chunk++) {
            const start = chunk * chunkSize;
            const end = Math.min(start + chunkSize, audioData.length);
            const samples = audioData.slice(start, end);
            
            const freqs = demodulateHybrid(samples, sampleRate);
            demodulatedFreq.set(freqs, start);
            
            updateProgress((chunk + 1) / numChunks * 50); // First 50%
        }
        
        const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
        log(`Demodulation complete in ${elapsed}s`);
        
        return demodulatedFreq;
    }
    
    // ==========================================================================
    // DOPPLER ESTIMATION via SYNC PULSES
    // ==========================================================================
    
    function estimateDoppler() {
        if (!demodulatedFreq) demodulateFullAudio();
        
        log('Estimating Doppler shift from sync pulses...');
        
        const samplesPerMs = sampleRate / 1000;
        const windowSize = Math.floor(5 * samplesPerMs); // 5ms windows
        const step = Math.floor(10 * samplesPerMs);       // 10ms steps
        
        const syncFreqs = [];
        
        // Search for 1200Hz sync pulses
        for (let i = 0; i < demodulatedFreq.length - windowSize; i += step) {
            // Average frequency in window
            let sum = 0;
            for (let j = 0; j < windowSize; j++) {
                sum += demodulatedFreq[i + j];
            }
            const avgFreq = sum / windowSize;
            
            // If it looks like a sync pulse (around 1200Hz)
            if (avgFreq > 1100 && avgFreq < 1350) {
                syncFreqs.push({
                    time: i / sampleRate,
                    freq: avgFreq
                });
            }
        }
        
        if (syncFreqs.length < 10) {
            log('Not enough sync pulses found for Doppler estimation');
            return 0;
        }
        
        // Calculate average deviation from 1200Hz
        let totalDeviation = 0;
        for (const s of syncFreqs) {
            totalDeviation += s.freq - FREQ.SYNC;
        }
        const avgDoppler = totalDeviation / syncFreqs.length;
        
        // Also check for Doppler drift (linear regression)
        const n = syncFreqs.length;
        let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
        for (const s of syncFreqs) {
            sumX += s.time;
            sumY += s.freq - FREQ.SYNC;
            sumXY += s.time * (s.freq - FREQ.SYNC);
            sumXX += s.time * s.time;
        }
        const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
        
        log(`Doppler: avg=${avgDoppler.toFixed(1)}Hz, drift=${slope.toFixed(3)}Hz/s`);
        log(`Found ${syncFreqs.length} sync pulses`);
        
        return avgDoppler;
    }
    
    // ==========================================================================
    // VIS CODE DETECTION
    // ==========================================================================
    
    // ==========================================================================
    // PISTE DE FRÉQUENCE : fréquence instantanée + somme cumulée, moyenne d'un
    // intervalle en O(1) ; alimentée d'un bloc (fichier) ou au fil de l'eau (micro)
    // ==========================================================================
    
    function FreqTrack(rate, capacity) {
        this.rate = rate;
        this.f = new Float32Array(Math.max(1024, capacity || rate * 10));
        this.sum = new Float64Array(this.f.length + 1);
        this.len = 0;
    }
    
    FreqTrack.prototype.push = function (values) {
        const need = this.len + values.length;
        if (need > this.f.length) {
            let size = this.f.length * 2;
            while (size < need) size *= 2;
            const nf = new Float32Array(size); nf.set(this.f.subarray(0, this.len));
            const ns = new Float64Array(size + 1); ns.set(this.sum.subarray(0, this.len + 1));
            this.f = nf; this.sum = ns;
        }
        for (let i = 0; i < values.length; i++) {
            this.f[this.len] = values[i];
            this.sum[this.len + 1] = this.sum[this.len] + values[i];
            this.len++;
        }
    };
    
    FreqTrack.prototype.mean = function (start, end) {
        const a = Math.max(0, Math.min(this.len, Math.round(start)));
        const b = Math.max(0, Math.min(this.len, Math.round(end)));
        return b > a ? (this.sum[b] - this.sum[a]) / (b - a) : 0;
    };
    
    // Médiane sur un intervalle : insensible aux pointes du bruit
    FreqTrack.prototype.median = function (start, end) {
        const a = Math.max(0, Math.min(this.len, Math.round(start)));
        const b = Math.max(0, Math.min(this.len, Math.round(end)));
        if (b <= a) return 0;
        const v = this.f.slice(a, b).sort();
        return v[v.length >> 1];
    };
    
    // Garde les 'seconds' dernières secondes ; renvoie le décalage d'indice
    FreqTrack.prototype.keepTail = function (seconds) {
        const keep = Math.min(this.len, Math.round(seconds * this.rate));
        const shift = this.len - keep;
        const t = new FreqTrack(this.rate, this.f.length);
        t.push(this.f.subarray(shift, this.len));
        this.f = t.f; this.sum = t.sum; this.len = t.len;
        return shift;
    };
    
    let fileTrack = null;
    
    function getFileTrack() {
        if (!demodulatedFreq) demodulateFullAudio();
        if (!fileTrack) {
            fileTrack = new FreqTrack(sampleRate, demodulatedFreq.length);
            fileTrack.push(demodulatedFreq);
        }
        return fileTrack;
    }
    
    function meanFreq(start, end) {
        return getFileTrack().mean(start, end);
    }
    
    // VIS : amorce 1900 Hz, front vers le bit de start 1200 Hz (repère), 7 bits
    // de 30 ms poids faible en premier (1100 Hz = 1, 1300 Hz = 0), parité paire,
    // stop 1200 Hz. L'image commence à la fin du stop (repère + 300 ms).
    // Repères examinés de 'from' à 'to' (échantillons). Résultat ou null.
    function findVIS(track, from, to, off, logFn) {
        const spm = track.rate / 1000;
        const step = Math.max(1, Math.floor(spm));
        const first = Math.max(Math.ceil(300 * spm), Math.floor(from));
        const last = Math.min(Math.floor(to), track.len - Math.ceil(320 * spm));
        
        for (let e = first; e < last; e += step) {
            // Amorce avant, bit de start après (tri grossier par moyennes)
            const lead = track.mean(e - 250 * spm, e - 20 * spm);
            if (Math.abs(lead - 1900 - off) > 100) continue;
            if (track.mean(e + 5 * spm, e + 25 * spm) > lead - 250) continue;
            
            // Front précis amorce -> start : plus forte chute de fréquence
            // moyenne entre 5 ms avant et 5 ms après
            let edge = -1, drop = 250;
            for (let i = Math.floor(e - 15 * spm); i < e + 15 * spm; i++) {
                const d = track.mean(i - 5 * spm, i) - track.mean(i, i + 5 * spm);
                if (d > drop) { drop = d; edge = i; }
            }
            if (edge < 0) continue;
            
            // Décisions par médianes : start, 7 bits + parité, stop
            const med = (i0, i1) => track.median(edge + i0 * spm, edge + i1 * spm) - off;
            if (Math.abs(med(5, 25) - 1200) > 100) continue;
            const bits = [];
            let valid = true;
            for (let b = 0; b < 8; b++) {
                const m = med(30 * (b + 1) + 5, 30 * (b + 2) - 5);
                if (Math.abs(m - 1100) > 100 && Math.abs(m - 1300) > 100) { valid = false; break; }
                bits.push(m < 1200 ? 1 : 0);
            }
            if (!valid) continue;
            if (Math.abs(med(275, 295) - 1200) > 100) continue;
            
            let visCode = 0, ones = 0;
            for (let b = 0; b < 7; b++) { visCode |= bits[b] << b; ones += bits[b]; }
            if ((ones + bits[7]) % 2 !== 0) {
                logFn(`VIS 0x${visCode.toString(16).toUpperCase()} rejeté (parité) à ${(edge / track.rate).toFixed(3)}s`);
                e = edge + 300 * spm;
                continue;
            }
            
            const imageStart = Math.round(edge + 300 * spm);
            logFn(`VIS start bit at ${(edge / track.rate).toFixed(4)}s, bits ${bits.slice(0, 7).join('')} parity ${bits[7]}`);
            logFn(`VIS code: 0x${visCode.toString(16).toUpperCase()} (${visCode})`);
            return { visCode, imageStart, leaderStart: Math.round(edge - 610 * spm) };
        }
        return null;
    }
    
    function detectVIS() {
        const track = getFileTrack();
        log('Searching for VIS code...');
        const vis = findVIS(track, 0, track.len, dopplerOffset, log);
        if (vis) log(`Image starts at ${(vis.imageStart / sampleRate * 1000).toFixed(2)}ms`);
        else log('No VIS found');
        return vis;
    }
    
    // ==========================================================================
    // SYNC PULSE DETECTION (for line timing)
    // ==========================================================================
    
    function findSyncPulses(startSample, numSamples, syncMs) {
        const samplesPerMs = sampleRate / 1000;
        const syncDuration = Math.floor(syncMs * samplesPerMs);
        const searchWindow = Math.floor(5 * samplesPerMs);
        
        const syncs = [];
        
        const threshold = 1250 + dopplerOffset;
        const minFreq = 1100 + dopplerOffset;
        
        let inSync = false;
        let syncStart = 0;
        
        for (let i = startSample; i < startSample + numSamples; i += searchWindow) {
            // Check average frequency in window
            let sum = 0, count = 0;
            for (let j = 0; j < searchWindow && i + j < demodulatedFreq.length; j++) {
                sum += demodulatedFreq[i + j];
                count++;
            }
            const avgFreq = sum / count;
            
            if (avgFreq < threshold && avgFreq > minFreq) {
                if (!inSync) {
                    syncStart = i;
                    inSync = true;
                }
            } else {
                if (inSync) {
                    const syncLen = i - syncStart;
                    // Valid sync should be close to expected duration
                    if (syncLen > syncDuration * 0.5 && syncLen < syncDuration * 2) {
                        syncs.push({
                            start: syncStart,
                            end: i,
                            duration: syncLen / samplesPerMs
                        });
                    }
                    inSync = false;
                }
            }
        }
        
        return syncs;
    }
    
    // ==========================================================================
    // FREQUENCY TO PIXEL CONVERSION
    // ==========================================================================
    
    function freqToPixel(freq, offset = 0) {
        const adjustedFreq = freq - offset;
        const normalized = (adjustedFreq - FREQ.BLACK) / FREQ.RANGE;
        return Math.max(0, Math.min(255, Math.round(normalized * 255)));
    }
    
    // ==========================================================================
    // DECODE LINE DATA
    // ==========================================================================
    
    function decodeLine(startSample, durationMs, numPixels) {
        const samplesPerMs = sampleRate / 1000;
        const totalSamples = Math.floor(durationMs * samplesPerMs);
        const samplesPerPixel = totalSamples / numPixels;
        
        const pixels = new Uint8Array(numPixels);
        
        for (let px = 0; px < numPixels; px++) {
            const sampleStart = Math.floor(startSample + px * samplesPerPixel);
            const sampleEnd = Math.floor(startSample + (px + 1) * samplesPerPixel);
            
            // Average frequency for this pixel
            let sum = 0, count = 0;
            for (let i = sampleStart; i < sampleEnd && i < demodulatedFreq.length; i++) {
                sum += demodulatedFreq[i];
                count++;
            }
            
            const avgFreq = count > 0 ? sum / count : FREQ.BLACK;
            pixels[px] = freqToPixel(avgFreq, dopplerOffset);
        }
        
        return pixels;
    }
    
    // ==========================================================================
    // PD MODE DECODER
    // ==========================================================================
    
    function decodePD(mode, imageStart) {
        const canvas = document.getElementById('canvas');
        canvas.width = mode.width;
        canvas.height = mode.height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(mode.width, mode.height);
        
        const samplesPerMs = sampleRate / 1000;
        
        // PD timing: Sync(20ms) + Porch(2.08ms) + Y0 + R-Y + B-Y + Y1
        // All 4 data components have same duration (scanMs)
        const syncSamples = Math.floor(mode.syncMs * samplesPerMs);
        const porchSamples = Math.floor(mode.porchMs * samplesPerMs);
        const scanSamples = Math.floor(mode.scanMs * samplesPerMs);
        
        const pairDuration = mode.syncMs + mode.porchMs + mode.scanMs * 4;
        const samplesPerPair = Math.floor(pairDuration * samplesPerMs);
        const numPairs = Math.floor(mode.height / 2);
        
        log(`PD decode: ${numPairs} line pairs`);
        log(`Timing: Sync=${mode.syncMs}ms, Porch=${mode.porchMs}ms, Scan=${mode.scanMs}ms`);
        log(`Pair duration: ${pairDuration.toFixed(2)}ms = ${samplesPerPair} samples`);
        
        // Optional: Find first sync for better alignment
        const slantCorrection = parseFloat(document.getElementById('slantCorrection').value) || 0;
        const slantSamplesPerLine = slantCorrection * samplesPerMs;
        
        for (let pair = 0; pair < numPairs; pair++) {
            // Apply slant correction
            const slantOffset = Math.floor(pair * 2 * slantSamplesPerLine);
            const pairStart = imageStart + pair * samplesPerPair + slantOffset;
            
            // Component positions
            const y0Start = pairStart + syncSamples + porchSamples;
            const ryStart = y0Start + scanSamples;
            const byStart = ryStart + scanSamples;
            const y1Start = byStart + scanSamples;
            
            // Decode each component
            const Y0 = decodeLine(y0Start, mode.scanMs, mode.width);
            const RY = decodeLine(ryStart, mode.scanMs, mode.width);  // V
            const BY = decodeLine(byStart, mode.scanMs, mode.width);  // U
            const Y1 = decodeLine(y1Start, mode.scanMs, mode.width);
            
            // Convert YUV to RGB for both lines
            for (let lineOffset = 0; lineOffset < 2; lineOffset++) {
                const line = pair * 2 + lineOffset;
                if (line >= mode.height) break;
                
                const Y = lineOffset === 0 ? Y0 : Y1;
                
                for (let x = 0; x < mode.width; x++) {
                    const y = Y[x];
                    const u = BY[x] - 128;  // B-Y
                    const v = RY[x] - 128;  // R-Y
                    
                    // YUV to RGB (BT.601)
                    const r = y + 1.402 * v;
                    const g = y - 0.344 * u - 0.714 * v;
                    const b = y + 1.772 * u;
                    
                    const idx = (line * mode.width + x) * 4;
                    imgData.data[idx]     = Math.max(0, Math.min(255, Math.round(r)));
                    imgData.data[idx + 1] = Math.max(0, Math.min(255, Math.round(g)));
                    imgData.data[idx + 2] = Math.max(0, Math.min(255, Math.round(b)));
                    imgData.data[idx + 3] = 255;
                }
            }
            
            // Update progress (50-100%)
            updateProgress(50 + (pair + 1) / numPairs * 50);
            
            // Update canvas periodically
            if (pair % 10 === 0) {
                ctx.putImageData(imgData, 0, 0);
            }
        }
        
        ctx.putImageData(imgData, 0, 0);
        log('PD decode complete');
    }
    
    // ==========================================================================
    // ROBOT MODE DECODER
    // ==========================================================================
    
    // Fin de synchro (montée 1200 -> 1500 Hz, seuil 1350 Hz, fréquence lissée
    // sur ±0,4 ms) la plus proche de 'expected' dans ±winMs ; position
    // fractionnaire en échantillons, ou -1
    function findSyncEnd(track, expected, winMs, syncMs, off) {
        const spm = track.rate / 1000;
        const h = 0.4 * spm;
        const thr = 1350 + off;
        const a = Math.max(Math.ceil(h) + 1, Math.floor(expected - winMs * spm));
        const b = Math.min(track.len - Math.ceil(3 * spm), Math.ceil(expected + winMs * spm));
        let best = -1, bestDist = Infinity;
        let prev = track.mean(a - 1 - h, a - 1 + h);
        
        for (let i = a; i <= b; i++) {
            const cur = track.mean(i - h, i + h);
            if (prev < thr && cur >= thr) {
                const pos = i - 1 + (thr - prev) / (cur - prev);
                if (track.mean(pos - 0.8 * syncMs * spm, pos - 0.5 * spm) < thr &&
                    track.mean(pos + 0.3 * spm, pos + 2.5 * spm) > thr) {
                    const d = Math.abs(pos - expected);
                    if (d < bestDist) { bestDist = d; best = pos; }
                }
            }
            prev = cur;
        }
        return best;
    }
    
    // Droite des moindres carrés pos = a + b * ligne, avec rejet des écarts > 1 ms
    function fitLine(points, spm) {
        let pts = points;
        let a = 0, b = 0;
        for (let pass = 0; pass < 3; pass++) {
            const n = pts.length;
            if (n < 2) break;
            let sx = 0, sy = 0, sxx = 0, sxy = 0;
            for (const [x, y] of pts) { sx += x; sy += y; sxx += x * x; sxy += x * y; }
            b = (n * sxy - sx * sy) / (n * sxx - sx * sx);
            a = (sy - b * sx) / n;
            pts = points.filter(([x, y]) => Math.abs(y - (a + b * x)) < spm);
        }
        return { a, b, used: pts.length };
    }
    
    // Conversion Y, R-Y, B-Y (0-255) -> RGB, BT.601 échelle studio (Barber N7CXI)
    function yuvStudioToRgb(y, cr, cb, out, idx) {
        const yy = 1.164383 * (y - 16);
        out[idx]     = Math.max(0, Math.min(255, Math.round(yy + 1.596027 * (cr - 128))));
        out[idx + 1] = Math.max(0, Math.min(255, Math.round(yy - 0.391762 * (cb - 128) - 0.812968 * (cr - 128))));
        out[idx + 2] = Math.max(0, Math.min(255, Math.round(yy + 2.017232 * (cb - 128))));
        out[idx + 3] = 255;
    }
    
    // Pixels d'un balayage : moyenne de la fréquence sur chaque pixel
    function readPixels(track, start, durationMs, numPixels, off) {
        const per = durationMs * track.rate / 1000 / numPixels;
        const px = new Uint8Array(numPixels);
        for (let i = 0; i < numPixels; i++) {
            const f = track.mean(start + i * per, start + (i + 1) * per) - off;
            px[i] = Math.max(0, Math.min(255, Math.round((f - FREQ.BLACK) / FREQ.RANGE * 255)));
        }
        return px;
    }
    
    function robotLineMs(mode) {
        return mode.syncMs + mode.porchMs + mode.scanMs +
               (mode.separatorMs || 0) + (mode.chromaPorchMs || 0) + (mode.chromaMs || 0);
    }
    
    // Lecture d'une ligne Robot à partir de sa fin de synchro ; k = échelle de
    // temps mesurée / nominale
    function robotReadLine(track, syncEnd, k, mode, line, off) {
        const spm = track.rate / 1000;
        const yStart = syncEnd + mode.porchMs * spm * k;
        const r = { Y: readPixels(track, yStart, mode.scanMs * k, mode.width, off), C: null, isCr: false };
        if (mode.chromaMs) {
            const sepStart = yStart + mode.scanMs * spm * k;
            const sepFreq = track.mean(sepStart + 0.5 * spm * k, sepStart + (mode.separatorMs - 0.5) * spm * k) - off;
            // Séparateur 1500 Hz : R-Y ; 2300 Hz : B-Y ; ambigu : parité de ligne
            r.isCr = (sepFreq < 1700) ? true : (sepFreq > 2100) ? false : (line % 2 === 0);
            const cStart = sepStart + (mode.separatorMs + mode.chromaPorchMs) * spm * k;
            r.C = readPixels(track, cStart, mode.chromaMs * k, mode.width, off);
        }
        return r;
    }
    
    // Dessin d'une ligne Robot : R-Y et B-Y partagés par le couple (2n, 2n+1)
    function robotDrawLine(lines, line, mode, data) {
        const L = lines[line];
        if (!L) return;
        const neutral = robotDrawLine.neutral && robotDrawLine.neutral.length === mode.width
            ? robotDrawLine.neutral : (robotDrawLine.neutral = new Uint8Array(mode.width).fill(128));
        let cr = neutral, cb = neutral;
        if (mode.chromaMs) {
            for (const l of [line, line ^ 1]) {
                const M = lines[l];
                if (l >= mode.height || !M || !M.C) continue;
                if (M.isCr) { if (cr === neutral) cr = M.C; }
                else if (cb === neutral) cb = M.C;
            }
        }
        for (let x = 0; x < mode.width; x++) {
            yuvStudioToRgb(L.Y[x], cr[x], cb[x], data, (line * mode.width + x) * 4);
        }
    }
    
    function decodeRobot(mode, imageStart) {
        const canvas = document.getElementById('canvas');
        canvas.width = mode.width;
        canvas.height = mode.height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(mode.width, mode.height);
        
        const track = getFileTrack();
        const spm = track.rate / 1000;
        const lineMs = robotLineMs(mode);
        const lineSamples = lineMs * spm;
        
        log(`Robot decode: ${mode.height} lines, ${lineMs.toFixed(3)}ms/line nominal`);
        
        // 1. Fin de synchro de chaque ligne, suivie de proche en proche
        const points = [];
        let expected = imageStart + mode.syncMs * spm;
        for (let line = 0; line < mode.height; line++) {
            const pos = findSyncEnd(track, expected, line === 0 ? 20 : 4, mode.syncMs, dopplerOffset);
            if (pos >= 0) points.push([line, pos]);
            expected = (pos >= 0 ? pos : expected) + lineSamples;
            updateProgress(50 + (line + 1) / mode.height * 25);
        }
        
        // 2. Horloge mesurée : droite des moindres carrés
        let a, b;
        if (points.length >= 10) {
            const fit = fitLine(points, spm);
            a = fit.a; b = fit.b;
            log(`Syncs: ${points.length}/${mode.height} found, ${fit.used} used`);
            log(`Measured line period: ${(b / spm).toFixed(4)}ms (${((b / lineSamples - 1) * 1e6).toFixed(0)} ppm)`);
        } else {
            a = imageStart + mode.syncMs * spm; b = lineSamples;
            log(`Syncs: ${points.length}/${mode.height} found, nominal clock used`);
        }
        
        // 3. Lecture et dessin
        const lines = [];
        for (let line = 0; line < mode.height; line++) {
            lines[line] = robotReadLine(track, a + b * line, b / lineSamples, mode, line, dopplerOffset);
            updateProgress(75 + (line + 1) / mode.height * 25);
        }
        for (let line = 0; line < mode.height; line++) robotDrawLine(lines, line, mode, imgData.data);
        
        ctx.putImageData(imgData, 0, 0);
        log('Robot decode complete');
    }
    
    // ==========================================================================
    // MARTIN MODE DECODER
    // ==========================================================================
    
    function decodeMartin(mode, imageStart) {
        const canvas = document.getElementById('canvas');
        canvas.width = mode.width;
        canvas.height = mode.height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(mode.width, mode.height);
        
        const samplesPerMs = sampleRate / 1000;
        
        const syncSamples = Math.floor(mode.syncMs * samplesPerMs);
        const porchSamples = Math.floor(mode.porchMs * samplesPerMs);
        const scanSamples = Math.floor(mode.scanMs * samplesPerMs);
        const sepSamples = Math.floor(mode.separatorMs * samplesPerMs);
        
        // Martin: Sync + Porch + G + Sep + B + Sep + R + Sep
        const lineDuration = mode.syncMs + mode.porchMs + mode.scanMs * 3 + mode.separatorMs * 3;
        const samplesPerLine = Math.floor(lineDuration * samplesPerMs);
        
        log(`Martin decode: ${mode.height} lines, ${lineDuration.toFixed(2)}ms/line`);
        
        for (let line = 0; line < mode.height; line++) {
            const lineStart = imageStart + line * samplesPerLine;
            
            const gStart = lineStart + syncSamples + porchSamples;
            const bStart = gStart + scanSamples + sepSamples;
            const rStart = bStart + scanSamples + sepSamples;
            
            const G = decodeLine(gStart, mode.scanMs, mode.width);
            const B = decodeLine(bStart, mode.scanMs, mode.width);
            const R = decodeLine(rStart, mode.scanMs, mode.width);
            
            for (let x = 0; x < mode.width; x++) {
                const idx = (line * mode.width + x) * 4;
                imgData.data[idx]     = R[x];
                imgData.data[idx + 1] = G[x];
                imgData.data[idx + 2] = B[x];
                imgData.data[idx + 3] = 255;
            }
            
            updateProgress(50 + (line + 1) / mode.height * 50);
        }
        
        ctx.putImageData(imgData, 0, 0);
        log('Martin decode complete');
    }
    
    // ==========================================================================
    // SCOTTIE MODE DECODER
    // ==========================================================================
    
    function decodeScottie(mode, imageStart) {
        const canvas = document.getElementById('canvas');
        canvas.width = mode.width;
        canvas.height = mode.height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(mode.width, mode.height);
        
        const samplesPerMs = sampleRate / 1000;
        
        const syncSamples = Math.floor(mode.syncMs * samplesPerMs);
        const porchSamples = Math.floor(mode.porchMs * samplesPerMs);
        const scanSamples = Math.floor(mode.scanMs * samplesPerMs);
        const sepSamples = Math.floor(mode.separatorMs * samplesPerMs);
        
        // Scottie: Sep + G + Sep + B + Sync + Porch + R
        const lineDuration = mode.separatorMs * 2 + mode.scanMs * 3 + mode.syncMs + mode.porchMs;
        const samplesPerLine = Math.floor(lineDuration * samplesPerMs);
        
        log(`Scottie decode: ${mode.height} lines, ${lineDuration.toFixed(2)}ms/line`);
        
        // Initial sync before first line
        let currentSample = imageStart + syncSamples;
        
        for (let line = 0; line < mode.height; line++) {
            // Sep + G
            const gStart = currentSample + sepSamples;
            const G = decodeLine(gStart, mode.scanMs, mode.width);
            
            // Sep + B
            const bStart = gStart + scanSamples + sepSamples;
            const B = decodeLine(bStart, mode.scanMs, mode.width);
            
            // Sync + Porch + R
            const rStart = bStart + scanSamples + syncSamples + porchSamples;
            const R = decodeLine(rStart, mode.scanMs, mode.width);
            
            for (let x = 0; x < mode.width; x++) {
                const idx = (line * mode.width + x) * 4;
                imgData.data[idx]     = R[x];
                imgData.data[idx + 1] = G[x];
                imgData.data[idx + 2] = B[x];
                imgData.data[idx + 3] = 255;
            }
            
            currentSample += samplesPerLine;
            updateProgress(50 + (line + 1) / mode.height * 50);
        }
        
        ctx.putImageData(imgData, 0, 0);
        log('Scottie decode complete');
    }
    
    // ==========================================================================
    // SIGNAL ANALYSIS
    // ==========================================================================
    
    function analyzeSignal() {
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        
        progressBar.style.display = 'block';
        status.style.display = 'block';
        status.textContent = 'Analyzing signal...';
        
        setTimeout(() => {
            try {
                // Demodulate
                demodulateFullAudio();
                
                // Estimate Doppler
                const doppler = estimateDoppler();
                document.getElementById('statDoppler').textContent = doppler.toFixed(1);
                
                // Apply Doppler correction if AFC enabled
                if (document.getElementById('afcMode').value === 'auto') {
                    dopplerOffset = doppler;
                    document.getElementById('dopplerOffset').value = Math.round(doppler);
                    log(`AFC: Applied Doppler correction of ${doppler.toFixed(1)}Hz`);
                }
                
                // Detect VIS
                const vis = detectVIS();
                if (vis && VIS_TO_MODE[vis.visCode]) {
                    const modeName = VIS_TO_MODE[vis.visCode];
                    document.getElementById('statMode').textContent = SSTV_MODES[modeName].name;
                    document.getElementById('forceMode').value = modeName;
                } else {
                    document.getElementById('statMode').textContent = 'Unknown';
                }
                
                // Estimate SNR (rough)
                let signalPower = 0, noisePower = 0;
                const windowSize = 100;
                for (let i = 0; i < audioData.length - windowSize; i += windowSize) {
                    let sum = 0, sumSq = 0;
                    for (let j = 0; j < windowSize; j++) {
                        const v = audioData[i + j];
                        sum += v;
                        sumSq += v * v;
                    }
                    const mean = sum / windowSize;
                    const variance = sumSq / windowSize - mean * mean;
                    signalPower += sumSq / windowSize;
                    noisePower += variance * 0.1; // Rough estimate
                }
                const snr = 10 * Math.log10(signalPower / (noisePower + 0.0001));
                document.getElementById('statSNR').textContent = snr.toFixed(1);
                
                // Draw spectrogram
                drawSpectrogram();
                
                status.textContent = 'Analysis complete';
                updateProgress(100);
                
            } catch (err) {
                showError('Analysis error: ' + err.message);
                console.error(err);
            }
        }, 100);
    }
    
    // ==========================================================================
    // MAIN DECODE HANDLER
    // ==========================================================================
    
    function handleDecode() {
        if (!audioData) return;
        
        const progressBar = document.getElementById('progressBar');
        const status = document.getElementById('status');
        const errorDiv = document.getElementById('error');
        
        progressBar.style.display = 'block';
        status.style.display = 'block';
        errorDiv.style.display = 'none';
        
        // Get manual Doppler offset
        dopplerOffset = parseFloat(document.getElementById('dopplerOffset').value) || 0;
        
        status.textContent = 'Demodulating...';
        
        setTimeout(() => {
            try {
                // Demodulate if not already done
                if (!demodulatedFreq) {
                    demodulateFullAudio();
                }
                
                // Detect mode
                let modeName = document.getElementById('forceMode').value;
                let imageStart = 0;
                
                if (modeName === 'auto') {
                    const vis = detectVIS();
                    if (vis && VIS_TO_MODE[vis.visCode]) {
                        modeName = VIS_TO_MODE[vis.visCode];
                        imageStart = vis.imageStart;
                        log(`Auto-detected: ${modeName}`);
                    } else {
                        modeName = 'pd180'; // Default
                        log('VIS not found, defaulting to PD180');
                        // Try to find first sync
                        const syncs = findSyncPulses(0, Math.min(demodulatedFreq.length, sampleRate * 2), 20);
                        if (syncs.length > 0) {
                            imageStart = syncs[0].start;
                            log(`Found first sync at ${(imageStart/sampleRate).toFixed(3)}s`);
                        }
                    }
                } else {
                    // Manual mode - still try to find VIS for timing
                    const vis = detectVIS();
                    if (vis) {
                        imageStart = vis.imageStart;
                    } else {
                        const mode = SSTV_MODES[modeName];
                        const syncs = findSyncPulses(0, Math.min(demodulatedFreq.length, sampleRate * 2), mode.syncMs);
                        if (syncs.length > 0) {
                            imageStart = syncs[0].start;
                        }
                    }
                }
                
                const mode = SSTV_MODES[modeName];
                if (!mode) {
                    throw new Error('Unknown mode: ' + modeName);
                }
                
                log(`Decoding ${mode.name} from sample ${imageStart} (${(imageStart/sampleRate).toFixed(3)}s)`);
                status.textContent = `Decoding ${mode.name}...`;
                
                // Decode based on mode type
                switch (mode.lineSequence) {
                    case 'pd':
                        decodePD(mode, imageStart);
                        break;
                    case 'robot':
                        decodeRobot(mode, imageStart);
                        break;
                    case 'martin':
                        decodeMartin(mode, imageStart);
                        break;
                    case 'scottie':
                        decodeScottie(mode, imageStart);
                        break;
                    default:
                        throw new Error('Unsupported mode type: ' + mode.lineSequence);
                }
                
                status.textContent = '✓ Decode complete';
                document.getElementById('saveBtn').disabled = false;
                
            } catch (err) {
                showError('Decode error: ' + err.message);
                console.error(err);
            }
        }, 100);
    }

    function drawWaveform() {
        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
        
        // Draw waveform
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 1;
        ctx.beginPath();
        
        const step = Math.floor(audioData.length / width);
        for (let x = 0; x < width; x++) {
            const idx = x * step;
            const y = height / 2 - audioData[idx] * height / 2;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        
        // Time axis
        ctx.fillStyle = '#666';
        ctx.font = '10px monospace';
        const duration = audioData.length / sampleRate;
        for (let t = 0; t <= duration; t += 30) {
            const x = (t / duration) * width;
            ctx.fillText(t + 's', x, height - 2);
        }
    }
    
    function drawSpectrogram() {
        if (!demodulatedFreq) return;
        
        const canvas = document.getElementById('spectrogramCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
        
        // Draw frequency trace
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        
        const step = Math.floor(demodulatedFreq.length / width);
        for (let x = 0; x < width; x++) {
            const idx = x * step;
            const freq = demodulatedFreq[idx];
            // Map 1100-2400Hz to height
            const y = height - ((freq - 1100) / 1300) * height;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        
        // Frequency guides
        ctx.strokeStyle = '#333';
        ctx.setLineDash([5, 5]);
        ctx.fillStyle = '#666';
        ctx.font = '10px monospace';
        
        const freqGuides = [1200, 1500, 1900, 2300];
        for (const f of freqGuides) {
            const y = height - ((f - 1100) / 1300) * height;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
            ctx.fillText(f + 'Hz', 5, y - 2);
        }
        ctx.setLineDash([]);
    }

    // ==========================================================================
    // AUDIO EN DIRECT (MICRO)
    // Le micro est pris tel qu'il est : fréquence d'échantillonnage et voies
    // fournies par le navigateur, sans contrainte ; seuls les traitements vocaux
    // (annulation d'écho, réduction de bruit, gain automatique) sont coupés.
    // La chaîne de décodage (VIS, synchro, lecture des lignes) est celle du
    // mode fichier, appliquée au fil de l'eau sur une piste de fréquence.
    // ==========================================================================
    
    // Démodulateur FM en flux : mélange à 1900 Hz, passe-bas FIR (fenêtre de
    // Hamming, coupure 1950 Hz), fréquence = dérivée de la phase. Retard
    // constant de (N-1)/2 échantillons, identique pour tous les repères.
    function StreamDemod(rate) {
        this.rate = rate;
        let n = Math.round(3.3 * rate / 2100) | 1;
        const m = (n - 1) / 2;
        const fc = 1950 / rate;
        this.h = new Float64Array(n);
        let sum = 0;
        for (let i = 0; i < n; i++) {
            const t = i - m;
            const sinc = t === 0 ? 2 * fc : Math.sin(2 * Math.PI * fc * t) / (Math.PI * t);
            this.h[i] = sinc * (0.54 - 0.46 * Math.cos(2 * Math.PI * i / (n - 1)));
            sum += this.h[i];
        }
        for (let i = 0; i < n; i++) this.h[i] /= sum;
        this.n = n;
        this.bi = new Float64Array(2 * n);   // tampons doublés : lecture contiguë
        this.bq = new Float64Array(2 * n);
        this.pos = 0;
        this.w = 2 * Math.PI * 1900 / rate;
        this.cw = Math.cos(this.w); this.sw = Math.sin(this.w);
        this.oc = 1; this.os = 0;            // oscillateur local (phaseur)
        this.count = 0;
        this.pi = 1; this.pq = 0;
    }
    
    StreamDemod.prototype.process = function (input) {
        const out = new Float32Array(input.length);
        const n = this.n, h = this.h, bi = this.bi, bq = this.bq;
        const k = this.rate / (2 * Math.PI);
        for (let j = 0; j < input.length; j++) {
            // Mélange x · e^(-jwt)
            const x = input[j];
            const p = this.pos;
            bi[p] = bi[p + n] = x * this.oc;
            bq[p] = bq[p + n] = -x * this.os;
            this.pos = (p + 1) % n;
            const c = this.oc * this.cw - this.os * this.sw;
            this.os = this.os * this.cw + this.oc * this.sw;
            this.oc = c;
            if (++this.count === 4096) {        // renormalisation du phaseur
                const g = 1 / Math.hypot(this.oc, this.os);
                this.oc *= g; this.os *= g; this.count = 0;
            }
            // Filtre
            let zi = 0, zq = 0;
            const base = this.pos;
            for (let t = 0; t < n; t++) { zi += h[t] * bi[base + t]; zq += h[t] * bq[base + t]; }
            // Fréquence instantanée
            const re = zi * this.pi + zq * this.pq;
            const im = zq * this.pi - zi * this.pq;
            this.pi = zi; this.pq = zq;
            let f = 1900 + Math.atan2(im, re) * k;
            out[j] = f < 800 ? 800 : f > 3000 ? 3000 : f;
        }
        return out;
    };
    
    const LIVE_IDLE_SECONDS = 60;        // mémoire gardée en écoute

    const WORKLET_SOURCE = `
        class SstvTap extends AudioWorkletProcessor {
            constructor() { super(); this.buf = new Float32Array(2048); this.n = 0; }
            process(inputs) {
                const ch = inputs[0] && inputs[0][0];
                if (ch) {
                    for (let i = 0; i < ch.length; i++) {
                        this.buf[this.n++] = ch[i];
                        if (this.n === this.buf.length) {
                            this.port.postMessage(this.buf);
                            this.buf = new Float32Array(2048);
                            this.n = 0;
                        }
                    }
                }
                return true;
            }
        }
        registerProcessor('sstv-tap', SstvTap);`;

        if (liveAudioContext) {
            closeMic();
            try { await openMic(); } catch (err) { console.error(err); stopLiveAudio(); }
        }
    }
    
    async function startLiveAudio() {
        try {
            liveAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            await liveAudioContext.resume();
            const rate = liveAudioContext.sampleRate;   // fréquence du périphérique
            
            liveAnalyserNode = liveAudioContext.createAnalyser();
            liveAnalyserNode.fftSize = 2048;
            
            if (liveAudioContext.audioWorklet) {
                const url = URL.createObjectURL(new Blob([WORKLET_SOURCE], { type: 'application/javascript' }));
                await liveAudioContext.audioWorklet.addModule(url);
                URL.revokeObjectURL(url);
                liveTapNode = new AudioWorkletNode(liveAudioContext, 'sstv-tap');
                liveTapNode.port.onmessage = e => liveFeed(e.data);
            } else {
                liveTapNode = liveAudioContext.createScriptProcessor(4096, 1, 1);
                liveTapNode.onaudioprocess = e => liveFeed(new Float32Array(e.inputBuffer.getChannelData(0)));
            }
            liveTapNode.connect(liveAudioContext.destination);   // sortie muette
            
            liveInit(rate);
            await openMic();
            requestWakeLock();
            
            document.getElementById('startLiveBtn').disabled = true;
            document.getElementById('stopLiveBtn').disabled = false;
            document.getElementById('liveRecordBtn').disabled = false;
            liveVisualInterval = setInterval(updateLiveVisuals, 100);
            
        } catch (err) {
            console.error(err);
            stopLiveAudio();
        }
    }
    
    function stopLiveAudio() {
        if (liveVisualInterval) { clearInterval(liveVisualInterval); liveVisualInterval = null; }
        closeMic();
        if (liveTapNode) { try { liveTapNode.disconnect(); } catch (e) {} liveTapNode = null; }
        if (liveAudioContext) { liveAudioContext.close(); liveAudioContext = null; }
        if (liveWakeLock) { liveWakeLock.release(); liveWakeLock = null; }
        if (liveRx) liveFinishImage('arrêt');
        if (liveRecord) saveLiveRecord();
        document.getElementById('liveRecordBtn').disabled = true;
        
        document.getElementById('startLiveBtn').disabled = false;
        document.getElementById('stopLiveBtn').disabled = true;
        document.getElementById('levelMeter').style.width = '0%';
        document.getElementById('levelText').textContent = '-- dBFS';
        
        setLiveState('idle');
    }
    
    // Bloc d'échantillons reçu du micro
    function liveFeed(samples) {
        if (liveState === 'idle' || !liveDemod) return;
        let e = 0, pk = 0;
        for (let i = 0; i < samples.length; i++) {
            e += samples[i] * samples[i];
            const a = Math.abs(samples[i]);
            if (a > pk) pk = a;
        }
        liveLevel = Math.sqrt(e / samples.length);
        livePeak = pk;
        if (liveRecord) {
            liveRecord.chunks.push(samples.slice());
            liveRecord.length += samples.length;
            if (liveRecord.length >= LIVE_RECORD_MAX_SECONDS * liveRate) saveLiveRecord();
        }
        liveTrack.push(liveDemod.process(samples));
        
        if (liveState === 'receiving') liveWatchVIS();
        if (liveState === 'listening') liveListen();
        if (liveState === 'receiving') liveReceive();
    }
    
    // ==========================================================================
    // ÉCOUTE : VIS, ou synchros régulières si un mode est forcé
    // ==========================================================================
    
    function liveListen() {
        const spm = liveRate / 1000;
        const mode = SSTV_MODES[LIVE_MODE];
        
        // Mémoire bornée en écoute
        if (liveTrack.len > LIVE_IDLE_SECONDS * liveRate) {
            const shift = liveTrack.keepTail(5);
            liveVisFrom = Math.max(0, liveVisFrom - shift);
        }
        
        const to = liveTrack.len - Math.ceil(320 * spm);
        if (to <= liveVisFrom) return;
        
        // VIS Robot36 s'il passe ; sinon trois synchros régulières
        const vis = findVIS(liveTrack, liveVisFrom, to, liveDopplerOffset, liveLog);
        if (vis && vis.visCode === mode.visCode) {
            liveVisFrom = vis.imageStart;
            liveStartImage(LIVE_MODE, vis.imageStart, true);
            return;
        }
        const start = findRobotStart(liveTrack, mode, liveVisFrom, to);
        if (start >= 0) {
            liveVisFrom = start;
            liveStartImage(LIVE_MODE, start, false);
            return;
        }
        // Reprise là où la recherche de synchros s'est arrêtée (3 lignes avant la fin)
        const syncLimit = liveTrack.len - Math.ceil((3 * robotLineMs(mode) + 10) * spm);
        liveVisFrom = Math.max(liveVisFrom, Math.min(to, syncLimit));
    }
    
    // Synchro franche : 1200 Hz avant la fin de synchro, palier 1500 Hz après
    function isCleanSync(track, pos, mode) {
        const spm = track.rate / 1000;
        const sync = track.mean(pos - (mode.syncMs - 1) * spm, pos - 1 * spm) - liveDopplerOffset;
        const porch = track.mean(pos + 0.5 * spm, pos + (mode.porchMs - 0.5) * spm) - liveDopplerOffset;
        return Math.abs(sync - 1200) < 100 && Math.abs(porch - 1500) < 150;
    }
    
    // Sans VIS : quatre synchros franches espacées d'une ligne (±1 ms)
    function findRobotStart(track, mode, from, to) {
        const spm = track.rate / 1000;
        const T = robotLineMs(mode) * spm;
        const last = Math.min(to, track.len - 3 * T - 5 * spm);
        for (let e = Math.max(from, 10 * spm); e < last; e += 3 * spm) {
            let p = findSyncEnd(track, e, 1.5, mode.syncMs, liveDopplerOffset);
            if (p < 0 || !isCleanSync(track, p, mode)) continue;
            const first = p;
            let ok = true;
            for (let n = 1; n < 4 && ok; n++) {
                p = findSyncEnd(track, p + T, 1, mode.syncMs, liveDopplerOffset);
                ok = p >= 0 && isCleanSync(track, p, mode);
            }
            if (ok) return Math.round(first - mode.syncMs * spm);
        }
        return -1;
    }
    
    // Pendant une réception : un VIS Robot36 annonce une nouvelle image
    function liveWatchVIS() {
        const spm = liveRate / 1000;
        const to = liveTrack.len - Math.ceil(320 * spm);
        if (to <= liveVisFrom) return;
        const vis = findVIS(liveTrack, liveVisFrom, to, liveDopplerOffset, liveLog);
        liveVisFrom = vis ? vis.imageStart : to;
        if (vis && vis.visCode === SSTV_MODES[LIVE_MODE].visCode && liveRx && vis.imageStart > liveRx.start + spm * 1000) {
            liveFinishImage('nouveau VIS');
            liveStartImage(LIVE_MODE, vis.imageStart, true);
        }
    }
    
    function liveStartImage(modeName, start, fromVIS) {
        const mode = SSTV_MODES[modeName];
        const spm = liveRate / 1000;
        liveRx = {
            modeName, mode, start, fromVIS,
            line: 0, misses: 0, points: [], lines: [],
            expected: start + mode.syncMs * spm
        };
        liveLog(`${fromVIS ? 'VIS' : 'Synchro'} : ${mode.name}, début à ${(start / liveRate).toFixed(3)}s`);
        prepareLiveCanvas(mode);
        setLiveState('receiving');
    }
    
    // ==========================================================================
    // RÉCEPTION
    // ==========================================================================
    
    function liveReceive() {
        const rx = liveRx;
        if (!rx) return;
        if (rx.mode.lineSequence === 'robot') liveReceiveRobot(rx);
        else liveReceiveFixed(rx);
    }
    
    // Robot : fin de synchro suivie ligne par ligne, horloge mesurée en continu
    function liveReceiveRobot(rx) {
        const mode = rx.mode;
        const spm = liveRate / 1000;
        const T = robotLineMs(mode) * spm;
        
        while (rx.line < mode.height) {
            // Données nécessaires : fin de la ligne + fenêtre de recherche
            if (liveTrack.len < rx.expected + T + 6 * spm) return;
            
            const line = rx.line;
            const pos = findSyncEnd(liveTrack, rx.expected, line === 0 ? 20 : 4, mode.syncMs, liveDopplerOffset);
            if (pos >= 0) { rx.points.push([line, pos]); rx.misses = 0; }
            else rx.misses++;
            
            let syncEnd, k = 1, next;
            if (rx.points.length >= 8) {
                const fit = fitLine(rx.points, spm);
                syncEnd = fit.a + fit.b * line;
                k = fit.b / T;
                next = fit.a + fit.b * (line + 1);
            } else {
                syncEnd = pos >= 0 ? pos : rx.expected;
                next = syncEnd + T;
            }
            
            rx.lines[line] = robotReadLine(liveTrack, syncEnd, k, mode, line, liveDopplerOffset);
            robotDrawLine(rx.lines, line, mode, liveImageData.data);
            if (line & 1) robotDrawLine(rx.lines, line - 1, mode, liveImageData.data);
            
            rx.expected = next;
            rx.line++;
            updateLiveProgress(rx.line, mode.height, mode.height);
            
            if (rx.misses >= LIVE_MAX_MISSES) { liveFinishImage('signal perdu'); return; }
        }
        liveMainCtx.putImageData(liveImageData, 0, 0);
        liveFinishImage('image complète');
    }
    
    // Autres modes : durée de ligne nominale depuis le début d'image
    function liveReceiveFixed(rx) {
        const mode = rx.mode;
        const spm = liveRate / 1000;
        const lineMs = getLiveLineDuration(mode);
        const total = mode.lineSequence === 'pd' ? Math.floor(mode.height / 2) : mode.height;
        
        while (rx.line < total) {
            const lineStart = rx.start + rx.line * lineMs * spm;
            if (liveTrack.len < lineStart + lineMs * spm) return;
            decodeLiveOneLine(rx.line, mode, lineStart);
            rx.line++;
            updateLiveProgress(rx.line, total, mode.height);
        }
        liveFinishImage('image complète');
    }
    
    // Fin d'image : Robot redessiné avec l'horloge mesurée sur toute l'image
    function liveFinishImage(reason) {
        const rx = liveRx;
        liveRx = null;
        if (!rx) return;
        const mode = rx.mode;
        
        if (mode.lineSequence === 'robot' && rx.points.length >= 8) {
            const spm = liveRate / 1000;
            const T = robotLineMs(mode) * spm;
            const fit = fitLine(rx.points, spm);
            const lines = [];
            for (let line = 0; line < rx.line; line++) {
                lines[line] = robotReadLine(liveTrack, fit.a + fit.b * line, fit.b / T, mode, line, liveDopplerOffset);
            }
            for (let line = 0; line < rx.line; line++) robotDrawLine(lines, line, mode, liveImageData.data);
            liveLog(`Synchros : ${rx.points.length}/${rx.line}, période mesurée ${(fit.b / spm).toFixed(4)} ms (${((fit.b / T - 1) * 1e6).toFixed(0)} ppm)`);
        }
        liveMainCtx.putImageData(liveImageData, 0, 0);
        liveLog(`Fin d'image (${reason}) : ${rx.line} lignes`);
        document.getElementById('liveSaveBtn').disabled = false;
        
        if (liveState !== 'idle') {
            // Écoute reprise après la dernière ligne reçue
            liveVisFrom = Math.max(liveVisFrom, Math.floor(Math.min(rx.expected, liveTrack.len)));
            setLiveState('listening');
        }
    }
    
    function updateLiveProgress(done, total, height) {
        document.getElementById('liveProgressFill').style.width = (done / total * 100) + '%';
        if (liveMainCtx && (done % 4 === 0 || done === total)) liveMainCtx.putImageData(liveImageData, 0, 0);
    }
    
    function getLiveLineDuration(mode) {
        switch (mode.lineSequence) {
            case 'pd': return mode.syncMs + mode.porchMs + mode.scanMs * 4;
            case 'robot': return robotLineMs(mode);
            case 'martin': return mode.syncMs + mode.porchMs + mode.scanMs * 3 + mode.separatorMs * 3;
            case 'scottie': return mode.separatorMs * 2 + mode.scanMs * 3 + mode.syncMs + mode.porchMs;
        }
        return 100;
    }
    
    function decodeLiveOneLine(lineNum, mode, lineStart) {
        const spm = liveRate / 1000;
        const off = liveDopplerOffset;
        const px = (start, ms) => readPixels(liveTrack, start, ms, mode.width, off);
        
        switch (mode.lineSequence) {
            case 'pd': {
                const y0 = lineStart + (mode.syncMs + mode.porchMs) * spm;
                const ry = y0 + mode.scanMs * spm;
                const by = ry + mode.scanMs * spm;
                const y1 = by + mode.scanMs * spm;
                const Y0 = px(y0, mode.scanMs), RY = px(ry, mode.scanMs);
                const BY = px(by, mode.scanMs), Y1 = px(y1, mode.scanMs);
                drawLiveLineYUV(lineNum * 2, Y0, BY, RY, mode.width);
                if (lineNum * 2 + 1 < mode.height) drawLiveLineYUV(lineNum * 2 + 1, Y1, BY, RY, mode.width);
                break;
            }
            case 'martin': {
                const g = lineStart + (mode.syncMs + mode.porchMs) * spm;
                const b = g + (mode.scanMs + mode.separatorMs) * spm;
                const r = b + (mode.scanMs + mode.separatorMs) * spm;
                drawLiveLineRGB(lineNum, px(r, mode.scanMs), px(g, mode.scanMs), px(b, mode.scanMs), mode.width);
                break;
            }
            case 'scottie': {
                const g = lineStart + mode.separatorMs * spm;
                const b = g + (mode.scanMs + mode.separatorMs) * spm;
                const r = b + (mode.scanMs + mode.syncMs + mode.porchMs) * spm;
                drawLiveLineRGB(lineNum, px(r, mode.scanMs), px(g, mode.scanMs), px(b, mode.scanMs), mode.width);
                break;
            }
        }
    }
    
    // ==========================================================================
    // LIVE CANVAS DRAWING
    // ==========================================================================
    
    function prepareLiveCanvas(mode) {
        const canvas = document.getElementById('liveCanvas');
        canvas.width = mode.width;
        canvas.height = mode.height;
        liveMainCtx = canvas.getContext('2d');
        liveImageData = liveMainCtx.createImageData(mode.width, mode.height);
        for (let i = 3; i < liveImageData.data.length; i += 4) liveImageData.data[i] = 255;
        liveMainCtx.putImageData(liveImageData, 0, 0);
    }
    
    function drawLiveLineYUV(line, Y, U, V, w) {
        if (!liveImageData || line >= liveImageData.height) return;
        for (let x = 0; x < w; x++) {
            const y = Y[x], u = U[x] - 128, v = V[x] - 128;
            const idx = (line * w + x) * 4;
            liveImageData.data[idx] = Math.max(0, Math.min(255, Math.round(y + 1.402*v)));
            liveImageData.data[idx+1] = Math.max(0, Math.min(255, Math.round(y - 0.344*u - 0.714*v)));
            liveImageData.data[idx+2] = Math.max(0, Math.min(255, Math.round(y + 1.772*u)));
        }
    }
    
    function drawLiveLineRGB(line, R, G, B, w) {
        if (!liveImageData || line >= liveImageData.height) return;
        for (let x = 0; x < w; x++) {
            const idx = (line * w + x) * 4;
            liveImageData.data[idx] = R[x];
            liveImageData.data[idx+1] = G[x];
            liveImageData.data[idx+2] = B[x];
        }
    }
    
    function clearLiveImage() {
        const canvas = document.getElementById('liveCanvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        document.getElementById('liveProgressFill').style.width = '0%';
        document.getElementById('liveSaveBtn').disabled = true;
        if (liveState === 'receiving') { liveRx = null; setLiveState('listening'); }
    }
    
    function saveLiveImage() {
        const canvas = document.getElementById('liveCanvas');
        const link = document.createElement('a');
        link.download = 'sstv_live_' + Date.now() + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
    
    // ==========================================================================
    // LIVE UTILITIES
    // ==========================================================================
    
    function setLiveState(s) {
        liveState = s;
    }
    
    function liveLog(msg) {
        liveJournal.push(msg);                  // mémoire interne, jamais affichée
        if (liveJournal.length > 200) liveJournal.shift();
    }
    
    // ==========================================================================
    // ENREGISTREMENT DE LA CAPTURE (WAV PCM 16 bits mono, fréquence du micro)
    // ==========================================================================
    
    function toggleLiveRecord() {
        if (liveRecord) { saveLiveRecord(); return; }
        liveRecord = { chunks: [], length: 0, start: new Date() };
        document.getElementById('liveRecordBtn').textContent = '⏹ Arrêter et sauvegarder';
        liveLog('Enregistrement de la capture démarré');
    }
    
    function saveLiveRecord() {
        const rec = liveRecord;
        liveRecord = null;
        document.getElementById('liveRecordBtn').textContent = '⏺ Enregistrer la capture';
        if (!rec || rec.length === 0) return;
        
        const n = rec.length;
        const buf = new ArrayBuffer(44 + n * 2);
        const v = new DataView(buf);
        const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
        str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
        str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, liveRate, true); v.setUint32(28, liveRate * 2, true);
        v.setUint16(32, 2, true); v.setUint16(34, 16, true);
        str(36, 'data'); v.setUint32(40, n * 2, true);
        let o = 44;
        for (const c of rec.chunks) {
            for (let i = 0; i < c.length; i++, o += 2) {
                v.setInt16(o, Math.round(Math.max(-1, Math.min(1, c[i])) * 32767), true);
            }
        }
        
        const d = rec.start;
        const p2 = x => String(x).padStart(2, '0');
        const name = `capture_micro_${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}.wav`;
        const url = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
        const a = document.createElement('a');
        a.href = url; a.download = name; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        
        liveLog(`Capture sauvegardée : ${name}`);
    }
    
    function updateLiveVisuals() {
        // Jauge en dBFS sur -90 … 0 : efficace (barre) et crête (trait)
        const dB = x => x > 0 ? 20 * Math.log10(x) : -120;
        const pos = x => Math.max(0, Math.min(100, (dB(x) + 90) / 90 * 100));
        const rms = dB(liveLevel), peak = dB(livePeak);
        const bar = document.getElementById('levelMeter');
        bar.style.width = pos(liveLevel) + '%';
        bar.style.background = peak > -1 ? '#ff3333' : (rms < -60 ? '#ccaa00' : '#00cc00');
        document.getElementById('levelPeak').style.left = pos(livePeak) + '%';
        document.getElementById('levelText').textContent =
            `${rms > -100 ? rms.toFixed(0) : '--'} dBFS efficace, crête ${peak > -100 ? peak.toFixed(0) : '--'} dBFS`;
        if (liveRecord) {
            document.getElementById('liveRecordBtn').textContent =
                `⏹ Arrêter et sauvegarder (${(liveRecord.length / liveRate).toFixed(0)} s)`;
        }
    }
    
    </script>
</body>
