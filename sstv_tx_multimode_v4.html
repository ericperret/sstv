  Date       : 2026-10-18

                     moyennée sur le couple de lignes ; couleur BT.601 échelle
                     studio (Barber N7CXI) ; suppression du filtre passe-bas,
                     du lissage de fin de ligne et du choix de fréquence
                     d'échantillonnage
    4.2 (2026-10-18) Robot72 conforme (Y, R-Y et B-Y sur chaque ligne, ligne

                     calculée pour chaque structure de ligne
================================================================================
-->

    <script>

        scottieS1: {

            scanMs: 138.240,

        },
        scottieS2: {

            visCode: 0x38,
            width: 320,

            colorMode: "gbr",
            scanMs: 88.064,
            syncMs: 9.0,
            porchMs: 1.5,
            separatorMs: 1.5,

            blackFreq: 1500,

        },
        
        // PD modes (high resolution) - all 4 components have SAME duration
        pd90: {
            name: "PD90",
            visCode: 0x63,
            width: 320,
            height: 256,
            colorMode: "yuv",
            scanMs: 170.240,
            syncMs: 20.0,
            porchMs: 2.08,

        },
        pd120: {
            name: "PD120",
            visCode: 0x5F,
            width: 640,

            colorMode: "yuv",
            scanMs: 121.6,      // Each component: Y0, R-Y, B-Y, Y1 all same
            syncMs: 20.0,
            porchMs: 2.08,
            syncFreq: 1200,

            blackFreq: 1500,
            whiteFreq: 2300,
            lineSequence: "pd"
        },
        pd180: {
            name: "PD180",
            visCode: 0x60,
            width: 640,
            height: 496,
            colorMode: "yuv",
            scanMs: 183.04,     // Each component: Y0, R-Y, B-Y, Y1 all same
            syncMs: 20.0,
            porchMs: 2.08,
            syncFreq: 1200,
            porchFreq: 1500,
            blackFreq: 1500,
            whiteFreq: 2300,
            lineSequence: "pd"
        },
        pd160: {
            name: "PD160",
            visCode: 0x62,
            width: 512,
            height: 400,
            colorMode: "yuv",
            scanMs: 195.584,
            syncMs: 20.0,
            porchMs: 2.08,
            syncFreq: 1200,
            porchFreq: 1500,
            blackFreq: 1500,
            whiteFreq: 2300,
            lineSequence: "pd"
        },
        pd240: {
            name: "PD240",
            visCode: 0x61,
            width: 640,
            height: 496,
            colorMode: "yuv",
            scanMs: 244.48,
            syncMs: 20.0,
            porchMs: 2.08,
            syncFreq: 1200,
            porchFreq: 1500,
            blackFreq: 1500,
            whiteFreq: 2300,
            lineSequence: "pd"
        }
    };
    
    // VIS constants
    const VIS = {
        LEADER_FREQ: 1900,
        BREAK_FREQ: 1200,
        ONE_FREQ: 1100,
        ZERO_FREQ: 1300,
        BIT_MS: 30
    };
    
    // ==========================================================================
    // VARIABLES GLOBALES
    // ==========================================================================
    
    let imageData = null;
    
    // ==========================================================================
    // EVENT HANDLERS
    // ==========================================================================
    
    document.getElementById('fileInput').addEventListener('change', handleFileSelect);
    document.getElementById('encodeBtn').addEventListener('click', handleEncode);
    document.getElementById('sstvMode').addEventListener('change', updateModeInfo);
    
    function toggleAdvanced() {
        const opts = document.getElementById('advancedOptions');
        const toggle = document.querySelector('.advanced-toggle');
        opts.classList.toggle('show');
        toggle.textContent = opts.classList.contains('show') ? '▼ Options avancées' : '▶ Options avancées';
    }
    
    function updateModeInfo() {
        const mode = SSTV_MODES[document.getElementById('sstvMode').value];
        const desc = document.getElementById('modeDescription');
        const estTime = estimateTransmissionTime(mode);
        desc.innerHTML = `Résolution: ${mode.width}×${mode.height} | Couleur: ${mode.colorMode.toUpperCase()} | Durée estimée: ~${estTime}s`;
    }
    
    function estimateTransmissionTime(mode) {
        let lineTime;
        switch (mode.lineSequence) {
            case 'pd':              // une synchro pour deux lignes
                lineTime = (mode.syncMs + mode.porchMs + mode.scanMs * 4) / 2;
                break;
            case 'gbr_sequential':
                lineTime = mode.syncMs + mode.porchMs + mode.scanMs * 3 + mode.separatorMs * 3;
                break;
            case 'scottie':
                lineTime = mode.syncMs + mode.porchMs + mode.scanMs * 3 + mode.separatorMs * 2;
                break;
            case 'yuv_full':
                lineTime = mode.syncMs + mode.porchMs + mode.scanMs +
                           2 * (mode.separatorMs + mode.chromaPorchMs + mode.chromaMs);
                break;
            case 'yuv_interleaved':
                lineTime = mode.syncMs + mode.porchMs + mode.scanMs +
                           mode.separatorMs + mode.chromaPorchMs + mode.chromaMs;
                break;
            default:
                lineTime = mode.syncMs + mode.porchMs + mode.scanMs;
        }
        return Math.round(lineTime * mode.height / 1000);
    }
    
    // ==========================================================================
    // IMAGE HANDLING
    // ==========================================================================
    
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                normalizeImage(img);
                document.getElementById('encodeBtn').disabled = false;
                updateModeInfo();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
    
    function normalizeImage(img) {
        const mode = SSTV_MODES[document.getElementById('sstvMode').value];
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = mode.width;
        canvas.height = mode.height;
        
        // Calculate scaling to maintain aspect ratio
        const scale = Math.min(mode.width / img.width, mode.height / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        const x = (mode.width - w) / 2;
        const y = (mode.height - h) / 2;
        
        // Black background
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, mode.width, mode.height);
        
        // Draw centered image
        ctx.drawImage(img, x, y, w, h);
        
        imageData = ctx.getImageData(0, 0, mode.width, mode.height);
        
        canvas.style.display = 'block';
        
        const info = document.getElementById('imageInfo');
        info.style.display = 'block';
        info.innerHTML = `Image chargée: ${img.width}×${img.height} → ${mode.width}×${mode.height}`;
    }
    
    // ==========================================================================
    // CONVERSION COULEUR
    // ==========================================================================
    
    // Y, R-Y (V), B-Y (U) selon BT.601 échelle studio (Barber N7CXI, Dayton 2000)
    function rgbToYUV(imageData) {
        const width = imageData.width;
        const height = imageData.height;
        const pixels = imageData.data;
        const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
        
        const Y = [];
        const U = [];
        const V = [];
        
        for (let y = 0; y < height; y++) {
            Y[y] = new Uint8Array(width);
            U[y] = new Uint8Array(width);
            V[y] = new Uint8Array(width);
            
            for (let x = 0; x < width; x++) {
                const idx = (y * width + x) * 4;
                const r = pixels[idx];
                const g = pixels[idx + 1];
                const b = pixels[idx + 2];
                
                Y[y][x] = clamp(16 + (65.738 * r + 129.057 * g + 25.064 * b) / 256);
                V[y][x] = clamp(128 + (112.439 * r - 94.154 * g - 18.285 * b) / 256);
                U[y][x] = clamp(128 + (-37.945 * r - 74.494 * g + 112.439 * b) / 256);
            }
        }
        
        return { Y, U, V, width, height };
    }
    
    function rgbToGBR(imageData) {
        const width = imageData.width;
        const height = imageData.height;
        const pixels = imageData.data;
        
        const G = [];
        const B = [];
        const R = [];
        
        for (let y = 0; y < height; y++) {
            G[y] = new Uint8Array(width);
            B[y] = new Uint8Array(width);
            R[y] = new Uint8Array(width);
            
            for (let x = 0; x < width; x++) {
                const idx = (y * width + x) * 4;
                R[y][x] = pixels[idx];
                G[y][x] = pixels[idx + 1];
                B[y][x] = pixels[idx + 2];
            }
        }
        
        return { G, B, R, width, height };
    }
    
    // Moyenne de deux lignes (chrominance partagée par un couple de lignes)
    function averageRows(a, b) {
        const out = new Uint8Array(a.length);
        for (let x = 0; x < a.length; x++) out[x] = Math.round((a[x] + b[x]) / 2);
        return out;
    }
    
    // ==========================================================================
    // GÉNÉRATION DU SIGNAL
    // Le temps théorique de chaque segment est cumulé en millisecondes (double)
    // et seule la fin de chaque segment est arrondie à l'échantillon : aucune
    // erreur ne s'accumule d'une ligne à l'autre. Phase continue.
    // ==========================================================================
    
    const SAMPLE_RATE = 44100;
    const AMPLITUDE = 0.8;
    
    function SignalWriter(sampleRate) {
        this.fs = sampleRate;
        this.buf = new Float32Array(sampleRate * 10);
        this.n = 0;       // prochain échantillon à écrire
        this.t = 0;       // fin théorique du dernier segment (ms)
        this.phase = 0;
    }
    
    SignalWriter.prototype.reserve = function (end) {
        if (end <= this.buf.length) return;
        let size = this.buf.length * 2;
        while (size < end) size *= 2;
        const nb = new Float32Array(size);
        nb.set(this.buf.subarray(0, this.n));
        this.buf = nb;
    };
    
    // Ton fixe de durée ms
    SignalWriter.prototype.tone = function (freq, ms) {
        const end = Math.round((this.t + ms) * this.fs / 1000);
        this.reserve(end);
        const inc = 2 * Math.PI * freq / this.fs;
        for (; this.n < end; this.n++) {
            this.buf[this.n] = AMPLITUDE * Math.sin(this.phase);
            this.phase += inc;
        }
        this.phase %= 2 * Math.PI;
        this.t += ms;
    };
    
    // Balayage : values (0-255) réparties uniformément sur ms
    SignalWriter.prototype.scan = function (values, ms, blackFreq, whiteFreq) {
        const t0 = this.t;
        const end = Math.round((t0 + ms) * this.fs / 1000);
        this.reserve(end);
        const count = values.length;
        const k = (whiteFreq - blackFreq) / 255;
        const pixelsPerMs = count / ms;
        for (; this.n < end; this.n++) {
            let p = Math.floor((this.n * 1000 / this.fs - t0) * pixelsPerMs);
            if (p < 0) p = 0; else if (p >= count) p = count - 1;
            const freq = blackFreq + values[p] * k;
            this.buf[this.n] = AMPLITUDE * Math.sin(this.phase);
            this.phase += 2 * Math.PI * freq / this.fs;
        }
        this.phase %= 2 * Math.PI;
        this.t += ms;
    };
    
    SignalWriter.prototype.samples = function () {
        return this.buf.subarray(0, this.n);
    };
    
    // ==========================================================================
    // CODE VIS : amorce 300 ms, coupure 10 ms, amorce 300 ms, start 30 ms,
    // 7 bits poids faible en premier (1 = 1100 Hz, 0 = 1300 Hz), parité paire,
    // stop 30 ms
    // ==========================================================================
    
    function writeVIS(w, visCode) {
        w.tone(VIS.LEADER_FREQ, 300);
        w.tone(VIS.BREAK_FREQ, 10);
        w.tone(VIS.LEADER_FREQ, 300);
        w.tone(VIS.BREAK_FREQ, VIS.BIT_MS);
        let ones = 0;
        for (let bit = 0; bit < 7; bit++) {
            const one = (visCode >> bit) & 1;
            ones += one;
            w.tone(one ? VIS.ONE_FREQ : VIS.ZERO_FREQ, VIS.BIT_MS);
        }
        w.tone((ones & 1) ? VIS.ONE_FREQ : VIS.ZERO_FREQ, VIS.BIT_MS);
        w.tone(VIS.BREAK_FREQ, VIS.BIT_MS);
    }
    
    // ==========================================================================
    // ENCODEURS PAR MODE
    // ==========================================================================
    
    function writeRobotLines(w, colorData, mode, updateProgress) {
        const isColor = mode.colorMode === 'yuv' && mode.chromaMs;
        
        for (let lineNum = 0; lineNum < colorData.height; lineNum++) {
            w.tone(mode.syncFreq, mode.syncMs);
            w.tone(mode.porchFreq, mode.porchMs);
            w.scan(colorData.Y[lineNum], mode.scanMs, mode.blackFreq, mode.whiteFreq);
            
            if (isColor) {
                // Ligne paire : R-Y ; ligne impaire : B-Y ; moyenne du couple
                const isEvenLine = (lineNum % 2 === 0);
                const first = lineNum - (lineNum % 2);
                const second = Math.min(first + 1, colorData.height - 1);
                const plane = isEvenLine ? colorData.V : colorData.U;
                const chroma = averageRows(plane[first], plane[second]);
                
                w.tone(isEvenLine ? mode.separatorEvenFreq : mode.separatorOddFreq, mode.separatorMs);
                w.tone(mode.chromaPorchFreq, mode.chromaPorchMs);
                w.scan(chroma, mode.chromaMs, mode.blackFreq, mode.whiteFreq);
            }
            
            updateProgress((lineNum + 1) / colorData.height * 100);
        }
    }
    
    // Robot72 : synchro, palier, Y, séparateur 1500 Hz, palier 1900 Hz, R-Y,
    // séparateur 2300 Hz, palier 1500 Hz, B-Y
    function writeRobotFullLines(w, colorData, mode, updateProgress) {
        for (let lineNum = 0; lineNum < colorData.height; lineNum++) {
            w.tone(mode.syncFreq, mode.syncMs);
            w.tone(mode.porchFreq, mode.porchMs);
            w.scan(colorData.Y[lineNum], mode.scanMs, mode.blackFreq, mode.whiteFreq);
            w.tone(mode.separatorEvenFreq, mode.separatorMs);
            w.tone(mode.chromaPorchFreq, mode.chromaPorchMs);
            w.scan(colorData.V[lineNum], mode.chromaMs, mode.blackFreq, mode.whiteFreq);
            w.tone(mode.separatorOddFreq, mode.separatorMs);
            w.tone(mode.chromaPorch2Freq, mode.chromaPorchMs);
            w.scan(colorData.U[lineNum], mode.chromaMs, mode.blackFreq, mode.whiteFreq);
            updateProgress((lineNum + 1) / colorData.height * 100);
        }
    }
    
    // Martin : synchro, palier, G, séparateur, B, séparateur, R, séparateur
    function writeMartinLines(w, colorData, mode, updateProgress) {
        for (let lineNum = 0; lineNum < colorData.height; lineNum++) {
            w.tone(mode.syncFreq, mode.syncMs);
            w.tone(mode.porchFreq, mode.porchMs);
            w.scan(colorData.G[lineNum], mode.scanMs, mode.blackFreq, mode.whiteFreq);
            w.tone(mode.porchFreq, mode.separatorMs);
            w.scan(colorData.B[lineNum], mode.scanMs, mode.blackFreq, mode.whiteFreq);
            w.tone(mode.porchFreq, mode.separatorMs);
            w.scan(colorData.R[lineNum], mode.scanMs, mode.blackFreq, mode.whiteFreq);
            w.tone(mode.porchFreq, mode.separatorMs);
            updateProgress((lineNum + 1) / colorData.height * 100);
        }
    }
    
    // Scottie : synchro initiale, puis séparateur, G, séparateur, B, synchro,
    // palier, R
    function writeScottieLines(w, colorData, mode, updateProgress) {
        w.tone(mode.syncFreq, mode.syncMs);
        for (let lineNum = 0; lineNum < colorData.height; lineNum++) {
            w.tone(mode.porchFreq, mode.separatorMs);
            w.scan(colorData.G[lineNum], mode.scanMs, mode.blackFreq, mode.whiteFreq);
            w.tone(mode.porchFreq, mode.separatorMs);
            w.scan(colorData.B[lineNum], mode.scanMs, mode.blackFreq, mode.whiteFreq);
            w.tone(mode.syncFreq, mode.syncMs);
            w.tone(mode.porchFreq, mode.porchMs);
            w.scan(colorData.R[lineNum], mode.scanMs, mode.blackFreq, mode.whiteFreq);
            updateProgress((lineNum + 1) / colorData.height * 100);
        }
    }
    
    // PD : synchro, palier, Y0, R-Y, B-Y, Y1 (chrominance moyennée du couple)
    function writePDLines(w, colorData, mode, updateProgress) {
        const totalPairs = Math.floor(colorData.height / 2);
        for (let pair = 0; pair < totalPairs; pair++) {
            const line0 = pair * 2;
            const line1 = line0 + 1;
            w.tone(mode.syncFreq, mode.syncMs);
            w.tone(mode.porchFreq, mode.porchMs);
            w.scan(colorData.Y[line0], mode.scanMs, mode.blackFreq, mode.whiteFreq);
            w.scan(averageRows(colorData.V[line0], colorData.V[line1]), mode.scanMs, mode.blackFreq, mode.whiteFreq);
            w.scan(averageRows(colorData.U[line0], colorData.U[line1]), mode.scanMs, mode.blackFreq, mode.whiteFreq);
            w.scan(colorData.Y[line1], mode.scanMs, mode.blackFreq, mode.whiteFreq);
            updateProgress((pair + 1) / totalPairs * 100);
        }
    }
    
    // ==========================================================================
    // FICHIER WAV : PCM 16 bits mono, en-tête RIFF canonique 44 octets
    // ==========================================================================
    
    function createWAVBuffer(audioData, sampleRate) {
        const length = audioData.length;
        const arrayBuffer = new ArrayBuffer(44 + length * 2);
        const view = new DataView(arrayBuffer);
        
        const writeString = (offset, string) => {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        };
        
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + length * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);             // taille du bloc fmt
        view.setUint16(20, 1, true);              // PCM
        view.setUint16(22, 1, true);              // mono
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true); // octets par seconde
        view.setUint16(32, 2, true);              // octets par échantillon
        view.setUint16(34, 16, true);             // bits par échantillon
        writeString(36, 'data');
        view.setUint32(40, length * 2, true);
        
        let offset = 44;
        for (let i = 0; i < length; i++) {
            const sample = Math.max(-1, Math.min(1, audioData[i]));
            view.setInt16(offset, Math.round(sample * 32767), true);
            offset += 2;
        }
        
        return arrayBuffer;
    }
    
    // Signal complet (mire, VIS, image) → WAV
    function buildWAV(imageData, modeName, options, updateProgress) {
        const mode = SSTV_MODES[modeName];
        const progress = updateProgress || (() => {});
        const colorData = mode.colorMode === 'gbr' ? rgbToGBR(imageData) : rgbToYUV(imageData);
        const w = new SignalWriter(SAMPLE_RATE);
        
        if (options.includeCalibration) w.tone(1900, 1000);
        if (options.includeVIS) writeVIS(w, mode.visCode);
        
        if (mode.lineSequence === 'gbr_sequential') writeMartinLines(w, colorData, mode, progress);
        else if (mode.lineSequence === 'scottie') writeScottieLines(w, colorData, mode, progress);
        else if (mode.lineSequence === 'pd') writePDLines(w, colorData, mode, progress);
        else if (mode.lineSequence === 'yuv_full') writeRobotFullLines(w, colorData, mode, progress);
        else writeRobotLines(w, colorData, mode, progress);
        
        const samples = w.samples();
        return { wav: createWAVBuffer(samples, SAMPLE_RATE), seconds: samples.length / SAMPLE_RATE };
    }
    
    // ==========================================================================
    // ENCODAGE (interface)
    // ==========================================================================
    
    function handleEncode() {
        if (!imageData) return;
        
        const encodeBtn = document.getElementById('encodeBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const status = document.getElementById('status');
        const errorDiv = document.getElementById('error');
        
        encodeBtn.disabled = true;
        progressBar.style.display = 'block';
        status.style.display = 'block';
        errorDiv.style.display = 'none';
        
        const modeName = document.getElementById('sstvMode').value;
        const mode = SSTV_MODES[modeName];
        const options = {
            includeVIS: document.getElementById('includeVIS').checked,
            includeCalibration: document.getElementById('includeCalibration').checked
        };
        
        // Remise à l'échelle de l'image pour le mode choisi
        const canvas = document.getElementById('canvas');
        if (canvas.width !== mode.width || canvas.height !== mode.height) {
            const img = new Image();
            img.src = canvas.toDataURL();
            img.onload = () => {
                normalizeImage(img);
                setTimeout(() => performEncode(), 50);
            };
            return;
        }
        
        setTimeout(() => performEncode(), 50);
        
        function performEncode() {
            try {
                status.textContent = `Encodage ${mode.name}...`;
                const result = buildWAV(imageData, modeName, options, percent => {
                    progressFill.style.width = percent + '%';
                });
                
                const wavBlob = new Blob([result.wav], { type: 'audio/wav' });
                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sstv_${modeName}_${Date.now()}.wav`;
                a.click();
                URL.revokeObjectURL(url);
                
                const sizeKB = Math.round(wavBlob.size / 1024);
                status.textContent = `✓ Encodage terminé ! Durée: ${result.seconds.toFixed(1)}s | Taille: ${sizeKB} KB | PCM 16 bits mono 44 100 Hz`;
                status.style.borderLeftColor = '#00ff88';
                
            } catch (error) {
                console.error(error);
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Erreur: ' + error.message;
            } finally {
                encodeBtn.disabled = false;
            }
        }
    }
    
    // Initialize
    updateModeInfo();
    </script>
